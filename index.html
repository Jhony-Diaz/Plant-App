<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Plant App</title>
</head>
<body>
    <div class="plant-card-body">
        <h1>Body Plant</h1>
        <h3 id="plant-level-body">Plant Level: 1</h3>
        <button id="activity-button">Do An Activity?</button>
    </div>

    <aside id="activities-panel" class="body-panel hidden">
        <form action="" id="body-form">
            <h3>Log Activity</h3>
            <button data-activity="Cardio" type="button" class="body-activities">Cardio</button>
            <button data-activity="Lift" type="button" class="body-activities">Lift</button>
            <button data-activity="Stretch" type="button" class="body-activities">Stretch</button>
            <label for="body-minutes">Log your minutes</label>
            <input type="number" id="body-minutes" min="1" placeholder="minutes" required>
            <button type="submit">Submit</button>
        </form>
        <p id="body-result">result</p>
    </aside>

    <script type="module" src="home.js"></script>
</body>
</html>
